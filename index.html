<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Calendar ♡</title>

    <!-- Polices -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- ═══════════════════════════════════════
         DÉCORATION HAUT
         ═══════════════════════════════════════ -->

    <div class="lace lace-top"></div>

    <div class="floating-heart">
        ♡
    </div>


    <!-- ═══════════════════════════════════════
         CONTENU PRINCIPAL
         ═══════════════════════════════════════ -->

    <main class="calendar-container">


        <!-- HEADER -->

        <header class="header">

            <div class="ornament">
                ꧁༺ ♡ ༻꧂
            </div>

            <h1>
                My Study Calendar
            </h1>

            <p class="subtitle">
                academic planner · autumn 2026
            </p>

            <div class="ornament">
                ⋅˚₊‧ ୨୧ ‧₊˚ ⋅
            </div>

        </header>



        <!-- ═══════════════════════════════════════
             CALENDRIER
             ═══════════════════════════════════════ -->

        <section class="calendar">


            <!-- NAVIGATION -->

            <div class="calendar-top">

                <button id="prevMonth"
                        class="nav-button">
                    ❮
                </button>


                <div class="month-title">

                    <h2 id="monthYear"></h2>

                    <div class="little-decoration">
                        ♡
                    </div>

                </div>


                <button id="nextMonth"
                        class="nav-button">
                    ❯
                </button>

            </div>



            <!-- JOURS DE LA SEMAINE -->

            <div class="weekdays">

                <div>Lun</div>
                <div>Mar</div>
                <div>Mer</div>
                <div>Jeu</div>
                <div>Ven</div>
                <div>Sam</div>
                <div>Dim</div>

            </div>



            <!-- CASES DU CALENDRIER -->

            <div id="calendarDays"
                 class="calendar-days">
            </div>


        </section>



        <!-- ═══════════════════════════════════════
             LÉGENDE
             ═══════════════════════════════════════ -->

        <section class="legend">

            <h3>
                ♡ Study categories ♡
            </h3>


            <div class="legend-items">

                <span>
                    <i class="dot econ60801"></i>
                    ECON 60801
                </span>

                <span>
                    <i class="dot econ60803"></i>
                    ECON 60803
                </span>

                <span>
                    <i class="dot econ60804"></i>
                    ECON 60804
                </span>

                <span>
                    <i class="dot study"></i>
                    Étude
                </span>

                <span>
                    <i class="dot exercise"></i>
                    Exercices
                </span>

                <span>
                    <i class="dot exam"></i>
                    Examen
                </span>

            </div>

        </section>



        <!-- ═══════════════════════════════════════
             FENÊTRE DES DÉTAILS
             ═══════════════════════════════════════ -->

        <div id="eventModal"
             class="event-modal">


            <div class="modal-content">


                <button id="closeModal"
                        class="close-modal">
                    ×
                </button>


                <div class="modal-ornament">
                    ꧁༺ ♡ ༻꧂
                </div>


                <h2 id="modalDate">
                    Date
                </h2>


                <div id="modalEvents"
                     class="modal-events">
                </div>


                <div class="modal-bottom">
                    ⋅˚₊‧ ୨୧ ‧₊˚ ⋅
                </div>


            </div>

        </div>



        <!-- FOOTER -->

        <footer>

            <span>
                ꧁༺
            </span>

            Ceteris Paribus

            <span>
                ༻꧂
            </span>

        </footer>


    </main>


    <!-- DÉCORATION BAS -->

    <div class="lace lace-bottom"></div>


    <script src="./script.js" defer></script>


</body>

</html>

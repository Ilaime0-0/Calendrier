<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Calendar ♡</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="lace lace-top"></div>

    <main class="calendar-container">

        <header class="header">

            <div class="ornament">꧁༺ ♡ ༻꧂</div>

            <h1>My Study Calendar</h1>

            <p class="subtitle">
                academic planner · autumn 2026
            </p>

            <div class="ornament">⋅˚₊‧ ୨୧ ‧₊˚ ⋅</div>

        </header>

        <section class="calendar">

            <div class="calendar-top">

                <button id="prevMonth" class="nav-button">
                    ❮
                </button>

                <div>
                    <h2 id="monthYear"></h2>
                    <p class="little-decoration">♡</p>
                </div>

                <button id="nextMonth" class="nav-button">
                    ❯
                </button>

            </div>

            <div class="weekdays">
                <div>Lun</div>
                <div>Mar</div>
                <div>Mer</div>
                <div>Jeu</div>
                <div>Ven</div>
                <div>Sam</div>
                <div>Dim</div>
            </div>

            <div id="calendarDays" class="calendar-days"></div>

        </section>

        <section class="legend">

            <h3>♡ Study categories ♡</h3>

            <div class="legend-items">

                <span>
                    <i class="dot course"></i>
                    Cours
                </span>

                <span>
                    <i class="dot study"></i>
                    Étude
                </span>

                <span>
                    <i class="dot exercise"></i>
                    Exercices
                </span>

                <span>
                    <i class="dot exam"></i>
                    Examen
                </span>

                <span>
                    <i class="dot assignment"></i>
                    Travail
                </span>

            </div>

        </section>

        <footer>
            <span>꧁༺</span>
            Study gently, study consistently
            <span>༻꧂</span>
        </footer>

    </main>

    <div class="lace lace-bottom"></div>

    <script src="script.js"></script>

</body>
</html>
